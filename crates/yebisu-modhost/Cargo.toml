[package]
name = "yebisu-modhost"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[dependencies]
anyhow = "1"
async-channel = "2"
gpui = { package = "gpui-pre", version = "=0.3.8" }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.8", features = ["font-kit", "x11", "wayland", "runtime_shaders"] }
gpui-shell = { path = "../../vendor/gpui-kit/crates/shell" }
gpui-base = { path = "../../vendor/gpui-kit/crates/base" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
usvg = { version = "0.46", default-features = false }

yebisu-mod-wire = { path = "../yebisu-mod-wire" }
zstd = "0.13"

[dev-dependencies]
tempfile = "3"
