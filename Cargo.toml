[workspace]
members = ["crates/yebisu-mod-wire", "crates/yebisu-modhost"]
exclude = ["crates/yebisu-modhost/vendor/*"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
yebisu-mod-wire = { path = "crates/yebisu-mod-wire" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
url = "2"
