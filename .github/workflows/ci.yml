name: CI
on: [push, pull_request]
jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Linux native dependencies
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libfontconfig1-dev libx11-xcb-dev libxkbcommon-x11-dev libwayland-dev libvulkan-dev libclang-dev libssl-dev pkg-config cmake ninja-build
      - run: cargo fmt --check --all
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
